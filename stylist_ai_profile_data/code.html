<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stylist AI - Measurement Input</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#5f5e5e",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c8c6c5",
                        "primary-container": "#1c1b1b",
                        "tertiary-fixed-dim": "#e9c349",
                        "on-tertiary-fixed": "#241a00",
                        "on-tertiary-container": "#4f3e00",
                        "on-secondary-container": "#5f6161",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#454747",
                        "primary-fixed": "#e5e2e1",
                        "surface": "#fbf9f9",
                        "inverse-on-surface": "#f2f0f0",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-fixed": "#1a1c1c",
                        "outline": "#747878",
                        "primary": "#000000",
                        "surface-dim": "#dbdad9",
                        "background": "#fbf9f9",
                        "on-tertiary-fixed-variant": "#574500",
                        "secondary-fixed-dim": "#c6c6c7",
                        "tertiary": "#735c00",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary": "#5d5f5f",
                        "on-surface": "#1b1c1c",
                        "on-primary-fixed-variant": "#474746",
                        "surface-container-high": "#e9e8e7",
                        "on-surface-variant": "#444748",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#ffe088",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1b1c1c",
                        "on-primary-container": "#858383",
                        "surface-container-highest": "#e4e2e2",
                        "inverse-surface": "#303031",
                        "surface-bright": "#fbf9f9",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-container-low": "#f5f3f3",
                        "on-error": "#ffffff",
                        "surface-variant": "#e4e2e2",
                        "surface-container": "#efeded",
                        "tertiary-container": "#cca730",
                        "secondary-container": "#dcdddd",
                        "outline-variant": "#c4c7c7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "120px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px",
                        "container-max": "1280px",
                        "unit": "8px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Playfair Display"],
                        "label-caps": ["Inter"],
                        "button": ["Inter"],
                        "display-lg-mobile": ["Playfair Display"],
                        "headline-md": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "button": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Input Styling */
        .luxury-input {
            appearance: none;
            background: transparent;
            border: none;
            border-bottom: 1px solid #e2e2e2;
            border-radius: 0;
            padding: 8px 0;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #1b1c1c;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        .luxury-input:focus {
            outline: none;
            border-bottom-color: #000000;
            box-shadow: none;
        }
        .luxury-input::placeholder {
            color: #c4c7c7;
            font-weight: 400;
        }
        
        /* Hide number spin buttons */
        .luxury-input::-webkit-outer-spin-button,
        .luxury-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .luxury-input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col font-sans selection:bg-surface-container-high">
<!-- Top Navigation (Task-Focused: Back Action Only) -->
<header class="w-full top-0 sticky bg-surface-container-lowest z-40 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md tracking-tighter text-primary uppercase">
            Stylist AI
        </div>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col items-center pt-12 pb-24 md:pt-24 md:pb-section-gap px-margin-mobile md:px-margin-desktop">
<div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-12 md:gap-gutter">
<!-- Left Column: Instructional Text & Inputs -->
<div class="md:col-span-5 flex flex-col justify-center">
<div class="mb-12">
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-primary mb-6">
                        Define Your Silhouette
                    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                        To curate pieces that drape perfectly and complement your unique proportions, we require a few foundational measurements. Accuracy ensures a flawless fit.
                    </p>
</div>
<div class="space-y-10">
<!-- Height Input -->
<div class="relative group">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest block mb-2 transition-colors group-focus-within:text-primary" for="height">
                            Height
                        </label>
<div class="flex items-end">
<input class="luxury-input w-32" id="height" min="0" placeholder="0" step="1" type="number"/>
<span class="font-body-md text-body-md text-secondary ml-4 pb-2 border-b border-transparent">cm</span>
</div>
</div>
<!-- Weight Input -->
<div class="relative group">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-widest block mb-2 transition-colors group-focus-within:text-primary" for="weight">
                            Weight
                        </label>
<div class="flex items-end">
<input class="luxury-input w-32" id="weight" min="0" placeholder="0" step="1" type="number"/>
<span class="font-body-md text-body-md text-secondary ml-4 pb-2 border-b border-transparent">kg</span>
</div>
</div>
</div>
</div>
<!-- Right Column: Photo Upload Area -->
<div class="md:col-span-6 md:col-start-7 flex flex-col">
<div class="font-label-caps text-label-caps text-secondary uppercase tracking-widest mb-4">
                    Reference Image
                </div>
<label class="relative flex-grow flex flex-col items-center justify-center border border-outline-variant bg-surface-bright cursor-pointer hover:bg-surface-container-low transition-colors min-h-[400px] md:min-h-[500px] group overflow-hidden" for="photo-upload">
<div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_25%,rgba(0,0,0,0.02)_50%,transparent_75%)] bg-[length:10px_10px] pointer-events-none opacity-50"></div>
<div class="z-10 flex flex-col items-center text-center p-8">
<span class="material-symbols-outlined text-4xl text-outline mb-6 group-hover:text-primary transition-colors" data-icon="photo_camera" style="font-variation-settings: 'wght' 200;">photo_camera</span>
<h3 class="font-body-lg text-body-lg text-primary mb-2">Upload a Full-Body Portrait</h3>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[250px]">
                            Drag and drop your image here, or click to browse. Neutral background preferred.
                        </p>
</div>
<input accept="image/png, image/jpeg, image/webp" class="hidden" id="photo-upload" type="file"/>
</label>
</div>
</div>
<!-- Action Footer -->
<div class="w-full max-w-4xl flex justify-end mt-16 md:mt-24 pt-8 border-t border-outline-variant">
<button class="bg-primary text-on-primary font-button text-button px-12 py-4 hover:opacity-80 transition-opacity active:scale-[0.98]">
                SAVE &amp; CONTINUE
            </button>
</div>
</main>
</body></html>
