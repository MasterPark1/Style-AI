<style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(0,0,0,0.5), transparent);
            animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(300px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top Nav App Bar Component (Hidden nav logic applied as this is a linear transactional/loading state, but header is kept for brand presence) -->
<header class="fixed top-0 w-full flex justify-center items-center h-16 z-50">
<h1 class="font-headline-md text-headline-md tracking-tighter text-primary">STYLIST AI</h1>
</header>
<main class="w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex flex-col items-center justify-center h-screen">
<!-- Animated Placeholder Area -->
<div class="relative w-full max-w-md aspect-square md:aspect-video mb-16 rounded-xl overflow-hidden border border-outline-variant shadow-sm" style="animation: pulse-slow 4s infinite;">
<div class="absolute inset-0 bg-surface-container flex items-center justify-center">

</div>
<div class="scan-line z-10"></div>
</div>
<!-- Typography Area -->
<div class="text-center space-y-6 max-w-2xl">
<h2 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-primary opacity-0 transition-opacity duration-1000 ease-in-out" id="text-1">
                Analyzing your unique silhouette...
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-0 transition-opacity duration-1000 delay-500 ease-in-out" id="text-2">
                Curating high-fashion matches...
            </p>
</div>
<!-- Progress Indicator -->
<div class="w-64 h-[1px] bg-outline-variant mt-16 relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary w-1/3 progress-bar"></div>
</div>
</main>
<script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.getElementById('text-1').classList.remove('opacity-0');
            }, 300);
            
            setTimeout(() => {
                document.getElementById('text-2').classList.remove('opacity-0');
            }, 1500);

            // Simple progress bar animation
            const progressBar = document.querySelector('.progress-bar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    // Could trigger redirect here in real app
                } else {
                    width += 0.5;
                    progressBar.style.width = width + '%';
                }
            }, 50);
        });
    </script>
</body></html>
